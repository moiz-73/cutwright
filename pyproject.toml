[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cutwright"
version = "0.1.0"
description = "Deterministic, no-browser motion engine and auto-editor for launch films"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "skia-python>=87", "opencv-python-headless>=4.8", "pillow>=10"]

[project.scripts]
cw = "cutwright.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
